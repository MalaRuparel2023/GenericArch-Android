# GenericArch-Android — starting version catalogue
#
# These values are a STARTING POINT, not an assertion. Reconcile them with your machine and your
# project before relying on them:
#
#     ./scripts/androidArchDoctor.sh
#
# Two rules bind:
#   1. No version is ever written in a module's build.gradle.kts — every one is an alias from here.
#   2. No dynamic versions ("+", "latest.release"). They make the build non-reproducible across
#      machines, which silently destroys the value of every other check in this framework.

[versions]
# SDK levels. minSdk is a PRODUCT decision — never take this default without deciding it.
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# Toolchain
agp = "8.12.3"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.32"
javaToolchain = "17"

# DI
hilt = "2.57"

# UI
composeBom = "2025.08.00"
lifecycle = "2.9.2"
navigation = "2.9.3"

# Data
retrofit = "2.11.0"
okhttp = "4.12.0"
room = "2.7.2"
datastore = "1.1.7"
coroutines = "1.10.2"
paging = "3.3.6"

# Quality
detekt = "1.23.8"
spotless = "7.0.4"
konsist = "0.17.3"
moduleGraphAssert = "2.9.0"
dependencyGuard = "0.5.0"

# Test
junit = "4.13.2"
robolectric = "4.14.1"
truth = "1.4.4"
turbine = "1.2.1"
paparazzi = "1.3.5"

[libraries]
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
module-graph-assert = { id = "com.jraska.module.graph.assertion", version.ref = "moduleGraphAssert" }
dependency-guard = { id = "com.dropbox.dependency-guard", version.ref = "dependencyGuard" }
