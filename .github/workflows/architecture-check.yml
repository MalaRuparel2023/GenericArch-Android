name: architecture-check

# One rule: all logic lives in the scripts and in Gradle. This file contains no logic — only
# checkout, toolchain, and invocation. That is what keeps the pipeline portable across CI providers
# and operating systems.

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Rule set is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate rule YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob("android/rules/*.yaml")):
              try:
                  yaml.safe_load(open(path))
                  print(f"valid  {path}")
              except yaml.YAMLError as e:
                  print(f"INVALID {path}: {e}", file=sys.stderr); bad = 1
          sys.exit(bad)
          PY

      - name: Scripts are syntactically valid and executable
        run: |
          status=0
          for f in scripts/*.sh; do
            bash -n "$f" || status=1
            [ -x "$f" ] || { echo "not executable: $f"; status=1; }
          done
          exit $status

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: androidArchDoctor
        run: ./scripts/androidArchDoctor.sh || true   # diagnostics inform; they do not gate

      - name: androidArchCheck
        run: ./scripts/androidArchCheck.sh

  # The job that keeps the cross-platform promise honest. Case sensitivity, line endings, the
  # gradlew exec bit and MAX_PATH are all caught here rather than by whoever switches machine next.
  cross-os:
    name: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: androidArchCheck
        shell: bash
        run: ./scripts/androidArchCheck.sh
